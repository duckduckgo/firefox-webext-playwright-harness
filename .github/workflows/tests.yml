name: Integration tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    # Pinned: Playwright only supports Firefox on the Ubuntu releases it knows
    # about, so `ubuntu-latest` rolling forward breaks `playwright install`.
    # Bump alongside @playwright/test.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Run unit tests
        run: npm run test:unit
      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox
      # Before `npm run playwright`, whose globalSetup patches the bundled Firefox —
      # the standalone entry point must work against the stock browser.
      - name: Run standalone tests
        run: npm run test:standalone
      - name: Run integration tests
        run: npm run playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
